      <stop offset="20%" stop-color="#000000" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#000000" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
