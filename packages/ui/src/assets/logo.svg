      <path d="M600 539C947 553 1207 725 1207 1042C1207 1220 1115 1402 907 1491C798 1538 669 1556 535 1556C392 1556 244 1536 110 1511L100 47L686 47ZM588 939C569 939 549 941 531 946L495 1189C523 1199 557 1206 590 1206C689 1206 748 1151 748 1074C748 992 682 939 588 939Z" fill="#000000" fill-rule="evenodd" />
