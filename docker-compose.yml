services:
  postgres:
    image: postgres:16-alpine
    container_name: smartdrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartdrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartdrive_dev}
      POSTGRES_DB: ${POSTGRES_DB:-smartdrive}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartdrive} -d ${POSTGRES_DB:-smartdrive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smartdrive-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: smartdrive-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartdrive}:${POSTGRES_PASSWORD:-smartdrive_dev}@postgres:5432/${POSTGRES_DB:-smartdrive}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      # dev live-reload; safe to keep for MVP
      - ./backend/src:/app/src:ro

volumes:
  pgdata:
  redisdata:
